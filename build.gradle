plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.139'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            def quickPlayWorld = providers.environmentVariable('IWM_QUICK_PLAY_WORLD').getOrNull()
            if (quickPlayWorld) {
                programArgument '--quickPlaySingleplayer'
                programArgument quickPlayWorld
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Local mod dependencies for runtime testing
    localRuntime files("../AlexsCaves/build/libs/alexscaves-2.0.2.jar")
    localRuntime files("../Citadel/build/libs/citadel-1.21.1-2.7.0.jar")

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

def languageResourceDir = layout.projectDirectory.dir('src/main/resources/assets/instantworldmirror/lang')
def mojibakeFragments = [
        '\u6402',
        '\u6d93\u682b\u666b',
        '\u95c0\u6ec8\u6f70',
        '\u9350\u5cf0\u5d48',
        '\u6fb6\u2541\u721e',
        '\u9352\u6fc7\u2175',
        '\ufffd'
]

tasks.register('checkLanguageResourceEncoding') {
    group = 'verification'
    description = 'Verifies language resources are valid UTF-8 and do not contain common mojibake fragments.'
    inputs.dir(languageResourceDir)

    doLast {
        def json = new groovy.json.JsonSlurper()
        languageResourceDir.asFileTree.matching { include '*.json' }.files.each { file ->
            def decoder = java.nio.charset.StandardCharsets.UTF_8.newDecoder()
            decoder.onMalformedInput(java.nio.charset.CodingErrorAction.REPORT)
            decoder.onUnmappableCharacter(java.nio.charset.CodingErrorAction.REPORT)
            def text = decoder.decode(java.nio.ByteBuffer.wrap(java.nio.file.Files.readAllBytes(file.toPath()))).toString()
            json.parseText(text)

            mojibakeFragments.each { fragment ->
                def codepoints = fragment.codePoints().toArray()
                        .collect { String.format('U+%04X', it) }
                        .join(' ')
                assert !text.contains(fragment): "Language resource ${file.name} contains mojibake fragment ${codepoints}"
            }
        }
    }
}

def mirrorLifecycleManifest = layout.projectDirectory.file('mirror-lifecycle/mirror-lifecycle-map.json')
def mirrorLifecycleGenerator = layout.projectDirectory.file('scripts/generate_mirror_lifecycle_status.py')
def mirrorLifecycleGeneratorTest = layout.projectDirectory.file('scripts/test_generate_mirror_lifecycle_status.py')
def readmeCodeMapManifest = layout.projectDirectory.file('docs/readme-code-map.json')
def readmeCodeMapChecker = layout.projectDirectory.file('scripts/check_readme_code_map.py')
def readmeCodeMapCheckerTest = layout.projectDirectory.file('scripts/test_check_readme_code_map.py')
def mirrorLifecycleStatusFiles = [
        layout.projectDirectory.file('mirror-lifecycle-status/raw.json'),
        layout.projectDirectory.file('mirror-lifecycle-status/report-index.md'),
        layout.projectDirectory.file('mirror-lifecycle-status/route-index.md'),
        layout.projectDirectory.file('mirror-lifecycle-status/coverage-matrix.json'),
        layout.projectDirectory.file('mirror-lifecycle-status/coverage-matrix.md'),
        layout.projectDirectory.file('mirror-lifecycle-status/tasks.md'),
        layout.projectDirectory.file('mirror-lifecycle-status/completion.json'),
        layout.projectDirectory.file('mirror-lifecycle-status/completion.md')
]

tasks.register('generateMirrorLifecycleStatus', Exec) {
    group = 'verification'
    description = 'Generate mirror lifecycle route and coverage reports from the manifest.'
    commandLine 'python', 'scripts/generate_mirror_lifecycle_status.py'
    inputs.file(mirrorLifecycleManifest)
    inputs.file(mirrorLifecycleGenerator)
    inputs.dir(layout.projectDirectory.dir('src/main/java'))
    inputs.dir(layout.projectDirectory.dir('src/main/resources'))
    outputs.files(mirrorLifecycleStatusFiles)
}

tasks.register('checkMirrorLifecycleCoverage', Exec) {
    group = 'verification'
    description = 'Verify generated mirror lifecycle reports are current and fully covered.'
    commandLine 'python', 'scripts/generate_mirror_lifecycle_status.py', '--check', '--fail-incomplete'
    inputs.file(mirrorLifecycleManifest)
    inputs.file(mirrorLifecycleGenerator)
    inputs.files(mirrorLifecycleStatusFiles)
    inputs.dir(layout.projectDirectory.dir('src/main/java'))
    inputs.dir(layout.projectDirectory.dir('src/main/resources'))
}

tasks.register('testMirrorLifecycleStatusGenerator', Exec) {
    group = 'verification'
    description = 'Run unit tests for the mirror lifecycle status generator.'
    commandLine 'python', '-m', 'unittest', 'scripts.test_generate_mirror_lifecycle_status'
    inputs.file(mirrorLifecycleGenerator)
    inputs.file(mirrorLifecycleGeneratorTest)
}

tasks.register('checkReadmeCodeMap', Exec) {
    group = 'verification'
    description = 'Verify README feature descriptions still map to live code anchors.'
    commandLine 'python', 'scripts/check_readme_code_map.py'
    inputs.file(layout.projectDirectory.file('README.md'))
    inputs.file(readmeCodeMapManifest)
    inputs.file(readmeCodeMapChecker)
    inputs.dir(layout.projectDirectory.dir('src/main/java'))
    inputs.dir(layout.projectDirectory.dir('src/main/resources'))
}

tasks.register('testReadmeCodeMapChecker', Exec) {
    group = 'verification'
    description = 'Run unit tests for the README code map checker.'
    commandLine 'python', '-m', 'unittest', 'scripts.test_check_readme_code_map'
    inputs.file(readmeCodeMapChecker)
    inputs.file(readmeCodeMapCheckerTest)
}

def persistentMirrorDimensionDir = layout.projectDirectory.dir('src/main/resources/data/instantworldmirror/dimension')
def persistentMirrorSourceFiles = [
        layout.projectDirectory.file('src/main/java/com/crabmods/instantworldmirror/world/ModDimensions.java'),
        layout.projectDirectory.file('src/main/java/com/crabmods/instantworldmirror/world/PersistentMirrorManager.java'),
        layout.projectDirectory.file('src/main/java/com/crabmods/instantworldmirror/world/WorldCopyService.java'),
        layout.projectDirectory.file('src/main/java/com/crabmods/instantworldmirror/item/DimensionMirrorItem.java'),
        layout.projectDirectory.file('src/main/java/com/crabmods/instantworldmirror/event/ModEvents.java')
]

tasks.register('persistentMirrorStaticTest') {
    group = 'verification'
    description = 'Verifies persistent mirror resources and lifecycle wiring.'
    inputs.dir(persistentMirrorDimensionDir)
    inputs.files(persistentMirrorSourceFiles)

    doLast {
        def json = new groovy.json.JsonSlurper()
        def dimensionDir = persistentMirrorDimensionDir.asFile
        (0..<8).each { index ->
            def dimensionFile = new File(dimensionDir, "persistent_mirror_world_${index}.json")
            assert dimensionFile.isFile(): "Missing persistent mirror dimension ${index}"
            def parsed = json.parse(dimensionFile)
            assert parsed.type == 'instantworldmirror:mirror_world': "Wrong dimension type in ${dimensionFile.name}"
            assert parsed.generator.type == 'instantworldmirror:mirror_chunk_generator': "Wrong generator in ${dimensionFile.name}"
            assert parsed.generator.biome == 'minecraft:plains': "Wrong biome in ${dimensionFile.name}"
        }

        def modDimensions = persistentMirrorSourceFiles[0].asFile.text
        assert modDimensions.contains('MAX_PERSISTENT_MIRROR_WORLD_POOL_SIZE = 8')
        assert modDimensions.contains('persistent_mirror_world_')
        assert modDimensions.contains('getPersistentMirrorWorld')
        assert modDimensions.contains('getMirrorEffectsKey')

        def persistentManager = persistentMirrorSourceFiles[1].asFile.text
        ['canCreatePersistentMirror', 'saveCurrentTemporaryMirror', 'enterPersistentMirror',
         'leavePersistentMirrorFromPosition', 'handlePersistentCopyComplete'].each { symbol ->
            assert persistentManager.contains(symbol): "PersistentMirrorManager missing ${symbol}"
        }

        def copyService = persistentMirrorSourceFiles[2].asFile.text
        assert copyService.contains('persistentCopyTasks')
        assert copyService.contains('queuePersistentWorldCopy')
        assert copyService.contains('processPersistentCopyQueues')

        def mirrorItem = persistentMirrorSourceFiles[3].asFile.text
        assert mirrorItem.contains('player.isShiftKeyDown()')
        assert mirrorItem.contains('MirrorKind.fromSandboxMode(sandboxMode)')
        assert mirrorItem.contains('shouldUseGeneratedContentRefresh(level, stack, bypassRefreshCooldown)')
        assert mirrorItem.contains('player, pos, kind, persistentAccess, generatedContentRefresh)')

        def events = persistentMirrorSourceFiles[4].asFile.text
        assert events.contains('PersistentMirrorManager.handleExternalExit')
        assert events.contains('MirrorWorldManager.isBeingTeleportedByMod')
    }
}

def optionsScreenMixinSource = layout.projectDirectory.file(
        'src/main/java/com/crabmods/instantworldmirror/mixin/client/OptionsScreenMixin.java')

tasks.register('optionsScreenMixinCompatibilityTest') {
    group = 'verification'
    description = 'Prevents fragile local-variable capture in the Options screen integration.'
    inputs.file(optionsScreenMixinSource)

    doLast {
        def source = optionsScreenMixinSource.asFile.text
        assert source.contains('@ModifyArg'): 'OptionsScreenMixin must modify a stable invocation argument'
        assert !source.contains('LocalCapture'): 'OptionsScreenMixin must not depend on the target local-variable table'
        assert !source.contains('CAPTURE_FAILHARD'): 'OptionsScreenMixin must not crash when another mod changes target locals'
    }
}

def mirrorJarRequiredEntries = [
        'com/crabmods/instantworldmirror/registry/ModEnchantments.class',
        'com/crabmods/instantworldmirror/item/FirstDreamMirrorItem.class',
        'com/crabmods/instantworldmirror/world/MirrorKind.class',
        'com/crabmods/instantworldmirror/world/PersistentMirrorData.class',
        'com/crabmods/instantworldmirror/world/PersistentMirrorManager.class',
        'com/crabmods/instantworldmirror/world/PersistentMirrorRecord.class',
        'com/crabmods/instantworldmirror/network/MirrorConfigSaveResultPacket.class',
        'com/crabmods/instantworldmirror/client/MirrorConfigNetworkGate.class',
        'assets/instantworldmirror/models/item/first_dream_mirror.json',
        'assets/instantworldmirror/textures/item/first_dream_mirror.png',
        'data/instantworldmirror/recipe/first_dream_mirror.json'
]
(0..<8).each { index ->
    mirrorJarRequiredEntries.add("data/instantworldmirror/dimension/persistent_mirror_world_${index}.json")
}
if (minecraft_version == '1.21.1') {
    mirrorJarRequiredEntries.addAll([
            'data/instantworldmirror/enchantment/permanence.json',
            'data/instantworldmirror/tags/item/mirror_enchantable.json',
            'data/minecraft/tags/enchantment/in_enchanting_table.json',
            'data/minecraft/tags/enchantment/non_treasure.json',
            'data/minecraft/tags/enchantment/tooltip_order.json',
            'data/minecraft/tags/enchantment/tradeable.json'
    ])
}
if (minecraft_version == '1.20.1') {
    mirrorJarRequiredEntries.add('com/crabmods/instantworldmirror/registry/ModEnchantments$PermanentMirrorEnchantment.class')
}
def mirrorJarOutput = layout.buildDirectory.file("libs/${mod_id}-${minecraft_version}-${mod_version}.jar")

tasks.register('verifyMirrorJarContents') {
    group = 'verification'
    description = 'Verifies the built jar contains mirror lifecycle classes and resources.'
    dependsOn tasks.named('assemble')
    inputs.file(mirrorJarOutput)

    doLast {
        def jarFile = mirrorJarOutput.get().asFile
        assert jarFile.isFile(): "Missing jar output: ${jarFile}"

        def entries = new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            jar.entries().collect { it.name }.toSet()
        }

        mirrorJarRequiredEntries.each { entry ->
            def requiredEntry = entry.toString()
            assert entries.contains(requiredEntry): "Jar missing required mirror lifecycle entry: ${requiredEntry}"
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('testMirrorLifecycleStatusGenerator')
    dependsOn tasks.named('checkMirrorLifecycleCoverage')
    dependsOn tasks.named('testReadmeCodeMapChecker')
    dependsOn tasks.named('checkReadmeCodeMap')
    dependsOn tasks.named('persistentMirrorStaticTest')
    dependsOn tasks.named('optionsScreenMixinCompatibilityTest')
    dependsOn tasks.named('checkLanguageResourceEncoding')
}

tasks.named('build') {
    dependsOn tasks.named('verifyMirrorJarContents')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
